name: Linkbox CI - on Pull Request

on:
  pull_request:
    branches: ["master"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Testing ci
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          package-json-file: "web/package.json"
          cache: true
          cache-dependency-path: "web/pnpm-lock.yaml"

      - name: Run test
        working-directory: ./web
        run: pnpm test
