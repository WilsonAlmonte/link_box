name: Linkbox CI - on Pull Request

on:
  pull_request:
    branches: ["master"]

jobs:
  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Pnpm
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          package-json-file: "web/package.json"
          cache: true
          cache-dependency-path: "web/pnpm-lock.yaml"

      - name: Run lint web
        working-directory: ./web
        run: pnpm run lint

      - name: Run test web
        working-directory: ./web
        run: pnpm run test

  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"

      - name: Run go tests
        working-directory: ./api
        run: go test -v ./...
