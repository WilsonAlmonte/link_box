services:
  web:
    image: ghcr.io/wilsonalmonte/linkbox-web:sha-e4f751f
    restart: "no"
    volumes:
      - web_dist:/output

  # --- optional --- you can use the DATABASE_URL alone
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE}
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER} -d ${PGDATABASE}"]
      interval: 5s
      timeout: 3s
      retries: 10
  # --- optional ---
  migrate:
    image: ghcr.io/wilsonalmonte/linkbox-migrations:sha-e4f751f
    restart: "no"
    environment:
      DATABASE_URL: postgres://${PGUSER}:${PGPASSWORD}@db:5432/${PGDATABASE}
    depends_on:
      db:
        condition: service_healthy

  api:
    image: ghcr.io/wilsonalmonte/linkbox-api:sha-e4f751f
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${PGUSER}:${PGPASSWORD}@db:5432/${PGDATABASE}
    expose:
      - "8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - web_dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_completed_successfully
      api:
        condition: service_started

volumes:
  pg_data:
  web_dist:
